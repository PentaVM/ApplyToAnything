name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: applytoanything
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Import check
        working-directory: backend
        run: python -c "from app.main import app; print('backend OK:', app.title)"
      - name: Smoke tests (agregador, SQL, auth)
        working-directory: backend
        run: python -u tests_smoke.py
      - name: Connectors and account boundaries with SQLite
        working-directory: backend
        run: python -u tests_connectors.py
      - name: Connectors and account boundaries with PostgreSQL
        working-directory: backend
        env:
          ATA_DATABASE_URL: postgresql://postgres:test@localhost:5432/applytoanything
        run: python -u tests_connectors.py

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org com.applytoanything --project-name apply_to_anything
          python ../scripts/configure_android.py
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build installable APK
        env:
          ATA_BACKEND_URL: ${{ vars.ATA_BACKEND_URL }}
        run: |
          if [ -n "$ATA_BACKEND_URL" ]; then
            flutter build apk --release --dart-define="ATA_BACKEND_URL=$ATA_BACKEND_URL"
          else
            flutter build apk --release
          fi
      - name: Verify APK signature and manifest
        run: |
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$tools_dir/apksigner" verify --print-certs "$apk"
          "$tools_dir/aapt" dump badging "$apk" > "$RUNNER_TEMP/ata-badging.txt"
          grep -F "name='com.applytoanything.apply_to_anything'" "$RUNNER_TEMP/ata-badging.txt"
          grep -F "name='android.permission.INTERNET'" "$RUNNER_TEMP/ata-badging.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: apply-to-anything-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
