name: apply_to_anything
description: >-
  ApplyToAnything — busca empleo con swipe estilo Tinder, chat con IA asesora
  y preparación de postulaciones con el proveedor de IA que elijas.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/system.md
